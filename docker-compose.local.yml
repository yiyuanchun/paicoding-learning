# Uses existing paicoding-mysql; no separate MySQL or Redis is created.
services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: paicoding-rabbitmq
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${PAICODING_MQ_USERNAME:?Run scripts/start-local.ps1}
      RABBITMQ_DEFAULT_PASS: ${PAICODING_MQ_PASSWORD:?Run scripts/start-local.ps1}
      RABBITMQ_DEFAULT_VHOST: /
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    networks: [business]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  elasticsearch:
    image: elasticsearch:8.10.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms384m -Xmx384m"
    ports: ["127.0.0.1:9201:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    networks: [business]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  canal:
    image: canal/canal-server:v1.1.7
    ports: ["127.0.0.1:11111:11111"]
    environment:
      canal.destinations: paicoding
      canal.instance.master.address: paicoding-mysql:3306
      canal.instance.dbUsername: ${PAICODING_CANAL_DB_USERNAME:?Configure dedicated Canal account}
      canal.instance.dbPassword: ${PAICODING_CANAL_DB_PASSWORD:?Configure dedicated Canal password}
      canal.instance.connectionCharset: UTF-8
      # Read subscribed table metadata on demand. TSDB's initial whole-instance
      # snapshot requires system-schema access that this account does not have.
      # Schema/DDL changes require an explicit rebuild (see the deployment guide).
      canal.instance.tsdb.enable: "false"
      canal.instance.filter.regex: 'pai_coding\.(article|article_detail|user_info|column_article|search_cdc_signal)'
      canal.instance.filter.transaction.entry: "false"
      canal.instance.filter.query.ddl: "true"
      canal.instance.global.spring.xml: classpath:spring/file-instance.xml
      canal.file.data.dir: /home/admin/canal-server/data
      canal.instance.tsdb.dir: /home/admin/canal-server/data/tsdb
      canal.instance.memory.buffer.size: "16384"
      canal.instance.memory.batch.mode: ITEMSIZE
    volumes: ["canal-data:/home/admin/canal-server/data"]
    networks:
      business:
        ipv4_address: 172.30.91.10
    restart: unless-stopped
networks:
  business:
    external: true
    name: paicoding-business
volumes:
  rabbitmq-data:
  es-data:
  canal-data:
