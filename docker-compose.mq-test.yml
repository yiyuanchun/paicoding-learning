# Dedicated integration-test services. Never point the integration test at application databases.
services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mq-test-only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmq-test-only"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management
    hostname: paicoding-mq-integration
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mqtest
      RABBITMQ_DEFAULT_PASS: mq-test-only
      RABBITMQ_DEFAULT_VHOST: mq-integration
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
